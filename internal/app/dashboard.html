<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RecoGo</title>
<style>body{font:16px system-ui;color:#182b40;background:#f2f5f9;max-width:1100px;margin:40px auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:42px;margin:0}section{background:white;border-radius:18px;padding:25px;margin:20px 0;box-shadow:0 6px 20px #182b4008}input,select,button{font:inherit;border:1px solid #d4dce8;border-radius:9px;padding:10px;margin:4px}button{background:#245dcf;color:white;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#f5f7fb;padding:15px;border-radius:8px;max-height:350px;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.muted{color:#63748b}td,th{padding:10px;text-align:left;border-bottom:1px solid #eee}table{width:100%}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style>
<header><div><h1>RecoGo</h1><p class="muted">Сервис рекомендаций товаров на Go</p></div><span id="ready">Загрузка…</span></header>
<div class="grid"><section><h2>Рекомендации</h2><label>Пользователь <input id="user" value="user-001"></label><button id="recommend">Показать</button><table><thead><tr><th>Товар</th><th>Оценка</th><th>Причина</th></tr></thead><tbody id="items"></tbody></table><p id="version" class="muted"></p></section>
<section><h2>Новое событие</h2><input id="eventuser" value="user-001" placeholder="Пользователь"><input id="product" value="SKU-001" placeholder="Товар"><select id="type"><option value="view">Просмотр</option><option value="purchase">Покупка</option></select><button id="send">Отправить событие</button><p id="eventstatus" class="muted"></p></section></div>
<section><h2>Модель и версии</h2><p>Административный токен нужен для обучения и отката.</p><input id="token" type="password" placeholder="Admin token"><button id="train">Обучить новую версию</button><select id="versions"></select><button id="rollback">Активировать выбранную версию</button><pre id="output">Демонстрационные данные загружаются командой recogo seed.</pre></section>
<section><h2>Последнее обучение</h2><pre id="report"></pre></section>
<script>
const el=id=>document.getElementById(id);
async function api(path,method='GET',body){let headers={};if(method==='POST'){headers['Content-Type']='application/json';headers.Authorization='Bearer '+el('token').value}let r=await fetch(path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);return j}
async function refresh(){try{let r=await api('/readyz');el('ready').textContent=r.algorithm+' · готов'}catch(e){el('ready').textContent='Модель ещё не обучена'}let versions=await api('/versions');el('versions').replaceChildren();for(let v of versions){let o=document.createElement('option');o.value=v.version;o.textContent=v.version.slice(0,10)+(v.active?' · активна':'')+(v.valid?'':' · повреждена');el('versions').append(o)}el('report').textContent=JSON.stringify(await api('/report'),null,2)}
el('recommend').onclick=async()=>{try{let j=await api('/recommendations?user_id='+encodeURIComponent(el('user').value));el('items').replaceChildren();for(let item of j.recommendations){let tr=document.createElement('tr');for(let value of [item.product_id,item.score.toFixed(3),item.reason]){let td=document.createElement('td');td.textContent=value;tr.append(td)}el('items').append(tr)}el('version').textContent='Версия '+j.version}catch(e){el('version').textContent=e.message}};
el('send').onclick=async()=>{try{let j=await api('/events','POST',{event_id:crypto.randomUUID(),user_id:el('eventuser').value,product_id:el('product').value,type:el('type').value,timestamp:new Date().toISOString()});el('eventstatus').textContent=j.status}catch(e){el('eventstatus').textContent=e.message}};
el('train').onclick=async()=>{el('output').textContent='Обучение…';try{el('output').textContent=JSON.stringify(await api('/admin/train','POST',{}),null,2);await refresh()}catch(e){el('output').textContent=e.message}};
el('rollback').onclick=async()=>{try{el('output').textContent=JSON.stringify(await api('/admin/rollback','POST',{version:el('versions').value}),null,2);await refresh()}catch(e){el('output').textContent=e.message}};
refresh();
</script></html>
